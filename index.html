    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint: the saved choice, else the system setting.
         Parser-blocking and ahead of every stylesheet, so the page never
         flashes the wrong theme. lib/theme.ts takes over after mount. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        // Both scheme-specific theme-color tags follow the chosen theme, so a
        // visitor's choice wins over their system setting.
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', theme === 'light' ? '#F8FAFC' : '#0A0E14');
        });

        // First visit of the session to the home page only: a "PT" monogram
        // draws itself and fades into the page (0.95s from first paint, never
        // blocks input).
        // Skipped on repeat visits, deep links and under reduced motion.
        try {
          if (
            location.pathname === '/' &&
            !sessionStorage.getItem('intro-seen') &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            sessionStorage.setItem('intro-seen', '1');
            root.classList.add('intro');
            var done = function () {
              root.classList.remove('intro');
              var node = document.getElementById('intro');
              if (node) node.remove();
            };
            // Gone the moment its fade ends; the timer is only a backstop.
            document.addEventListener('animationend', function (event) {
              if (event.animationName === 'intro-out') done();
            });
            setTimeout(done, 2000);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #intro {
        display: none;
      }
      .intro #intro {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #0a0e14;
        pointer-events: none;
        animation: intro-out 0.25s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      [data-theme='light'] #intro {
        background: #f8fafc;
      }
      #intro svg {
        width: 84px;
        height: 56px;
        overflow: visible;
        color: #8fb4ff;
      }
      [data-theme='light'] #intro svg {
        color: #2f5bd3;
      }
      #intro path {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: intro-draw 0.38s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #intro path:nth-child(2) {
        animation-delay: 0.1s;
      }
      #intro path:nth-child(3) {
        animation-delay: 0.2s;
      }
      #intro path:nth-child(4) {
        animation-delay: 0.28s;
      }
      @keyframes intro-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes intro-out {
        to {
          opacity: 0;
          transform: scale(1.04);
        }
      }
    </style>
