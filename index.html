    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('pt-theme');
          var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.classList.toggle('light', !dark);
        } catch (e) {
          /* private mode: keep the dark default */
        }
      })();
